name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/setup@v2

      - name: Install dependencies
        working-directory: cards
        run: pnpm install --frozen-lockfile

      - name: Build Vite app
        working-directory: cards
        run: pnpm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install dependencies (test2)
        working-directory: test2
        run: pnpm install --frozen-lockfile

      - name: Build Vite app (test2)
        working-directory: test2
        run: pnpm run build

      - name: Install dependencies (test3)
        working-directory: test3
        run: pnpm install --frozen-lockfile

      - name: Build Vite app (test3)
        working-directory: test3
        run: pnpm run build

      - name: Install dependencies (test4)
        working-directory: test4
        run: pnpm install --frozen-lockfile

      - name: Build Vite app (test4)
        working-directory: test4
        run: pnpm run build
        env:
          VITE_PARSE_URL: ${{ vars.TEST4_PARSE_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Copy Vite build to _site
        run: |
          sudo rm -rf _site/cards
          sudo cp -r cards/dist/. _site/cards
          sudo cp cards/dist/404.html _site/404.html
          sudo rm -rf _site/test2
          sudo cp -r test2/dist/. _site/test2
          sudo rm -rf _site/test3
          sudo cp -r test3/dist/. _site/test3
          sudo rm -rf _site/test4
          sudo cp -r test4/dist/. _site/test4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<title>Decision Watch Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Light only, by choice: the test6/test7 design system has no dark theme.
   Every color is set explicitly so the page reads the same on any host. */
:root {
  color-scheme: light;
  --ink: #141414;
  --ink-2: #4d4c4a;
  --ink-3: #6e6d6b;
  --line-strong: #abaaa8;
  --line: #d9d8d5;
  --line-soft: #e8e6e2;
  --canvas: #f5f3f0;
  --surface: #ffffff;
  --action: #368727;
  --action-dark: #1e6f1d;
  --action-soft: #eaf3e7;
  /* Gaps are amber, never red: nothing has failed. */
  --contra: #8a5712;
  --contra-soft: #fbeedd;
  --weak: #b9852c;
  --weak-soft: #fdf6e8;
  --weak-text: #7a5a1c;
  --ok: #56666e;
  --ok-soft: #eef1f2;
  --analyst: #2f5f73;
  --ai: #5a4a9e;
  --ai-soft: #f3f0fb;
  --derived: #5f5e5c;
  --serif: 'Roboto Slab', Georgia, serif;
  --sans: 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--canvas); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Shell */
.app { display: grid; grid-template-rows: auto auto auto 1fr auto; min-height: 100%; }
.hdr { background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px; padding-inline: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand .firm { font-family: var(--serif); font-weight: 600; color: var(--action-dark); font-size: 19px; }
.brand .prod { font-family: var(--serif); font-size: 17px; }
.brand .pow { font-size: 12px; color: var(--ink-3); }
.hdr .ctl { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-2); }
.hdr select { border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 8px; background: var(--surface); color: var(--ink); max-width: 260px; }
.hdr .spacer { flex: 1; }
.linkbtn { background: none; border: none; color: var(--action-dark); font-weight: 600; padding: 4px 2px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-strong); }
.who { font-size: 14px; color: var(--ink-2); }

.tabs { background: var(--surface); border-bottom: 1px solid var(--line); padding-inline: 20px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 24px; }
.tab { background: none; border: none; border-bottom: 3px solid transparent; padding: 10px 2px 8px; font-size: 16px; font-weight: 600; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--action); }
.badge { background: var(--contra); color: #fff; border-radius: 10px; font-size: 12px; padding: 0 7px; line-height: 18px; }
.tabs .meet { margin-left: auto; font-size: 14px; color: var(--ink-2); padding-bottom: 10px; }
.tabs .meet b { color: var(--ink); }

.strip { background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 8px; padding-inline: 20px; display: grid; grid-template-columns: auto 1fr auto auto; gap: 14px; align-items: center; }
.play { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); display: grid; place-items: center; padding: 0; }
.play:hover { border-color: var(--ink); }
.play[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.strip .lbl { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.strip .date { font-weight: 700; font-size: 15px; min-width: 7.5em; text-align: right; }
.track { position: relative; height: 34px; }
.track input[type=range] { position: absolute; left: 0; right: 0; top: 4px; width: 100%; accent-color: var(--action); margin: 0; }
.track .tick { position: absolute; top: 22px; font-size: 10.5px; color: var(--ink-3); transform: translateX(-50%); white-space: nowrap; pointer-events: none; }
.track .mk { position: absolute; top: 0; width: 2px; height: 8px; transform: translateX(-1px); pointer-events: none; }
.track .mk.meeting { background: var(--analyst); height: 10px; }
.track .mk.snap { background: var(--ink-3); }

.body { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: 0; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding-block: 14px; padding-inline: 12px; display: flex; flex-direction: column; gap: 4px; }
.side h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 10px 8px 4px; font-weight: 600; }
.side .client { font-size: 12.5px; color: var(--ink-3); margin: 8px 8px 2px; }
.sitem { text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 7px 8px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.sitem:hover { background: var(--canvas); }
.sitem[aria-current="true"] { background: var(--action-soft); border-color: #cfe2c9; }
.sitem .nm { font-weight: 600; font-size: 14.5px; }
.sitem .sub { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-3); }
.counts { display: flex; gap: 6px; font-size: 12.5px; font-weight: 700; }
.c-contra { color: var(--contra); }
.c-weak { color: var(--weak-text); }
.newbtn { margin-top: 8px; border: 1px dashed var(--line-strong); background: none; border-radius: 8px; padding: 7px 8px; text-align: left; color: var(--ink-2); }
.side-picker { display: none; }

.main { padding-block: 18px 40px; padding-inline: 24px; min-width: 0; }
.foot { font-size: 12.5px; color: var(--ink-3); padding-block: 10px; padding-inline: 20px; border-top: 1px solid var(--line); background: var(--surface); }

/* Watch */
.viewbar { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; margin-bottom: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: none; background: none; padding: 6px 14px; font-weight: 600; color: var(--ink-2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: none; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
h1.pg { font-family: var(--serif); font-weight: 500; font-size: 24px; margin: 0; text-wrap: balance; }
.summary { color: var(--ink-2); margin: 4px 0 12px; }
.summary b { color: var(--ink); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; align-items: center; }
.filters .fl { font-size: 13px; color: var(--ink-3); margin-right: 4px; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 14px; padding: 2px 11px; font-size: 13.5px; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

.list { display: flex; flex-direction: column; gap: 10px; }
.gap { cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line-strong); border-radius: 8px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 6px 18px; text-align: left; width: 100%; }
.gap:hover { border-color: var(--line-strong); }
.gap.s-contradicting, .gap.s-missed, .gap.s-fired { border-left-color: var(--contra); }
.gap.s-weakening, .gap.s-near, .gap.s-expiring { border-left-color: var(--weak); }
.gap.s-ai { border-left-color: var(--ai); border-style: dashed; border-left-style: solid; }
.gap.is-new .stmt { font-weight: 700; }
.gap .top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.gap .stmt { font-size: 16px; font-weight: 600; grid-column: 1; }
.gap .meta { font-size: 13.5px; color: var(--ink-3); }
.gap .line2 { font-size: 13.5px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.gap > * { grid-column: 1; }
.gap .viz { grid-column: 2; grid-row: 1 / span 8; align-self: start; }
.gap .viz .cap { font-size: 12px; color: var(--ink-3); text-align: right; }
.state { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 13px; border-radius: 4px; padding: 1px 7px; white-space: nowrap; }
.state.contradicting, .state.missed, .state.fired { background: var(--contra-soft); color: var(--contra); }
.state.weakening, .state.near, .state.expiring { background: var(--weak-soft); color: var(--weak-text); }
.state.supported, .state.ontrack { background: var(--ok-soft); color: var(--ok); }
.state.untested, .state.stale { background: var(--canvas); color: var(--ink-3); }
.state.ai { background: var(--ai-soft); color: var(--ai); }
.life { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; border-radius: 3px; padding: 1px 6px; }
.life.new { background: var(--ink); color: #fff; }
.life.reopened { background: var(--contra); color: #fff; }
.life.reviewed { background: none; color: var(--ink-3); border: 1px solid var(--line); text-transform: none; letter-spacing: 0; font-weight: 600; }
.shared { font-size: 12.5px; color: var(--ink-2); background: var(--canvas); border-radius: 4px; padding: 1px 7px; }
.empty { padding: 26px; text-align: center; color: var(--ink-3); background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 8px; }

/* Provenance marks */
.pv { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; border: 1px solid var(--line-strong); color: var(--ink-2); border-radius: 3px; padding: 0 5px; white-space: nowrap; background: var(--surface); }
.pv.ext { border-color: var(--line-strong); }
.pv.analyst { border-color: var(--analyst); color: var(--analyst); }
.pv.ai { border-color: var(--ai); color: var(--ai); border-style: dashed; background: var(--ai-soft); }
.pv.derived { border-style: dotted; color: var(--derived); }
.pv.syn { border-color: var(--line); color: var(--ink-3); font-style: italic; background: repeating-linear-gradient(135deg, var(--surface) 0 4px, var(--canvas) 4px 8px); }

/* Trends */
.grid-charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.card h4 { margin: 0 0 2px; font-size: 15px; }
.card .sub { font-size: 12.5px; color: var(--ink-3); }
.card .trend { font-size: 13px; color: var(--ink-2); margin-top: 4px; }

/* Evidence */
.ev { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.ev.fresh { border-left: 4px solid var(--ink); }
.ev .row1 { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--ink-3); }
.ev .src { font-weight: 700; color: var(--ink); }
.ev q { font-size: 15px; quotes: "\201C" "\201D"; }
.touches { display: flex; flex-wrap: wrap; gap: 6px; }
.touch { border: 1px solid var(--line); background: var(--canvas); border-radius: 6px; padding: 3px 8px; font-size: 13px; text-align: left; display: inline-flex; gap: 6px; align-items: center; }
.touch:hover { border-color: var(--line-strong); }

/* Coming up */
.cu { display: grid; grid-template-columns: 110px 1fr; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.cu > div { padding: 9px 14px; border-bottom: 1px solid var(--line-soft); }
.cu .d { font-weight: 700; font-size: 14px; }
.cu .d small { display: block; font-weight: 400; color: var(--ink-3); }
.cu .k { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }

/* Decision */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; max-width: 1060px; }
.sheet-hd { display: flex; flex-wrap: wrap; gap: 10px 16px; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 6px; }
.sheet-hd .lineage { color: var(--ink-3); font-size: 14px; margin-top: 4px; }
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 20px; padding: 6px 14px; font-weight: 600; }
.btn.primary { background: var(--action); border-color: var(--action); color: #fff; }
.btn.small { padding: 3px 10px; font-size: 13px; }
.btn.ai { border-style: dashed; border-color: var(--ai); color: var(--ai); background: var(--ai-soft); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.sec { padding-top: 16px; }
.sec > h2 { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; margin: 0 0 8px; }
.thesis { font-family: var(--serif); font-size: 19px; max-width: 60ch; margin: 0; }
.pos { display: grid; grid-template-columns: 90px minmax(0,1fr) auto; gap: 6px 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
.stance { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--ink); border-radius: 3px; padding: 1px 6px; text-align: center; justify-self: start; }
.bet { margin: 14px 0 4px; }
.bet .role { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.bet .txt { font-weight: 600; }
.arow { display: grid; grid-template-columns: 92px minmax(0,1fr) 88px 130px 150px; gap: 6px 12px; align-items: center; padding: 7px 8px; border-radius: 6px; width: 100%; text-align: left; background: none; border: 1px solid transparent; }
.arow:hover { background: var(--canvas); }
.arow .nec { font-size: 12.5px; color: var(--ink-3); }
.arow .nec b { color: var(--ink); font-weight: 600; }
.arow .conv { font-size: 13.5px; }
.arow.changed { background: var(--action-soft); }
.arow.ai-sug { border: 1px dashed var(--ai); background: var(--ai-soft); }
.old { text-decoration: line-through; color: var(--ink-3); margin-right: 4px; }
table.rm { border-collapse: collapse; font-size: 14px; }
table.rm th, table.rm td { border: 1px solid var(--line); padding: 5px 10px; text-align: center; }
table.rm th { font-weight: 600; background: var(--canvas); font-size: 13px; }
table.rm td.h { text-align: left; font-weight: 600; }
table.rm td .up { color: var(--contra); font-weight: 700; }
.lvl5 { background: var(--contra-soft); }
.lvl4 { background: var(--weak-soft); }
.scroll-x { overflow-x: auto; }
.draftbar { position: sticky; top: 0; z-index: 5; background: var(--ink); color: #fff; border-radius: 8px; padding: 8px 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 12px; }
.draftbar input { border-radius: 6px; border: none; padding: 4px 8px; min-width: 0; flex: 1 1 220px; color: var(--ink); }
.draftbar .btn { background: var(--surface); color: var(--ink); border-color: var(--surface); }
.draftbar .btn.primary { background: var(--action); color: #fff; border-color: var(--action); }
.tl { border-left: 2px solid var(--line); margin-left: 6px; padding-left: 16px; display: flex; flex-direction: column; gap: 12px; }
.tl .it { position: relative; }
.tl .it::before { content: ""; position: absolute; left: -22px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--ink-3); }
.tl .it.meeting::before { background: var(--analyst); }
.tl .it .d { font-weight: 700; font-size: 14px; }
.tl .it ul { margin: 4px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; }
.plist { display: flex; flex-direction: column; gap: 6px; }
.prow { font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.scard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; text-align: left; display: flex; flex-direction: column; gap: 6px; }
.scard:hover { border-color: var(--line-strong); }
.scard .t { font-family: var(--serif); font-size: 17px; }
.scard .c { font-size: 13px; color: var(--ink-3); }
.summary-page { max-width: 900px; }
.sum-eyebrow { font-size: 12.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
.sum-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px 28px; margin-top: 18px; }
.sum-grid h2 { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; margin: 0 0 6px; }
.sum-list { list-style: none; margin: 0; padding: 0; }
.sum-list li { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line-soft); font-size: 15px; }
.sum-click { cursor: pointer; }
.sum-click:hover { background: var(--canvas); }
.meta { color: var(--ink-3); font-size: 13.5px; white-space: nowrap; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(20,20,20,.28); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--surface); z-index: 21; box-shadow: -8px 0 30px rgba(0,0,0,.14); display: flex; flex-direction: column; }
.drawer .dh { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
.drawer .dh h2 { font-family: var(--serif); font-weight: 500; font-size: 20px; margin: 0; text-wrap: balance; }
.drawer .dh .x { margin-left: auto; border: none; background: none; font-size: 22px; line-height: 1; color: var(--ink-3); padding: 2px 6px; }
.drawer .db { overflow-y: auto; padding: 14px 20px 30px; display: flex; flex-direction: column; gap: 18px; }
.drawer h3 { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; }
.plain { color: var(--ink-2); margin: 4px 0 0; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; color: var(--ink-2); margin-top: 8px; }
.evgroup { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.evgroup > summary { list-style: none; cursor: pointer; padding: 8px 12px; background: var(--canvas); display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: 14px; }
.evgroup > summary::-webkit-details-marker { display: none; }
.evgroup > summary::before { content: "▸"; color: var(--ink-3); }
.evgroup[open] > summary::before { content: "▾"; }
.evi { padding: 8px 12px; border-top: 1px solid var(--line-soft); display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 4px 10px; font-size: 13.5px; }
.evi .when { color: var(--ink-3); }
.evi .what { display: flex; flex-direction: column; gap: 4px; }
.evi .tags { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.judge { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 2px; }
.judge button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 4px; padding: 1px 8px; font-size: 12.5px; }
.judge button:hover { border-color: var(--ink); }
.rel li { margin-bottom: 4px; }
.rel { margin: 0; padding-left: 18px; font-size: 14px; }
.aibox { border: 1px dashed var(--ai); background: var(--ai-soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; display: flex; flex-direction: column; gap: 8px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 20px; z-index: 40; font-size: 14px; }

/* Modal */
.modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(20,20,20,.35); padding: 16px; }
.modal .box { background: var(--surface); border-radius: 10px; max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 22px 26px; }
.modal h2 { font-family: var(--serif); font-weight: 500; margin: 0 0 8px; }
.modal p { max-width: 64ch; }

svg text { font-family: var(--sans); fill: var(--ink-3); }

@media (max-width: 860px) {
  .body { grid-template-columns: 1fr; }
  .side { display: none; }
  .side-picker { display: block; margin-bottom: 12px; }
  .side-picker select { width: 100%; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); }
  .main { padding-inline: 16px; }
  .hdr, .tabs, .strip, .foot { padding-inline: 16px; }
  .gap { grid-template-columns: 1fr; }
  .gap .viz { grid-column: 1; grid-row: auto; }
  .gap > * { grid-column: 1; }
  .arow { grid-template-columns: 1fr auto; }
  .arow .hide-sm { display: none; }
  .tabs .meet { margin-left: 0; width: 100%; padding-bottom: 8px; }
  .strip { grid-template-columns: 1fr auto auto; }
  .strip .lbl { display: none; }
  .pos { grid-template-columns: 80px minmax(0,1fr); }
  .pos > :last-child { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app" id="app">
  <header class="hdr" id="hdr"></header>
  <nav class="tabs" id="tabs"></nav>
  <div class="strip" id="strip"></div>
  <div class="body">
    <aside class="side" id="side"></aside>

  g += `<line x1="${x(asOf)}" x2="${x(asOf)}" y1="0" y2="${h}" stroke="var(--ink)" stroke-width="1.2"/>`;

function vizFor(s, key, asOf, compact) {

function renderTrends() {

function touchesFor(o, strats) {

    S.judged.filter(l => l.s===s && l.key===x.key && l.obs===o.id && l.d<=S.asOf).forEach(l => out.push({ s, key:x.key, stance:l.stance, origin:'analyst' }));
    AILINKS.filter(l => l.s===s && l.key===x.key && l.obs===o.id && l.d<=S.asOf).forEach(l => out.push({ s, key:x.key, stance:l.stance, origin:'ai' }));

function renderComing() {

  }

  const gapsSince = lm ? collectGaps([s], S.asOf).filter(g => g.state!=='ai' && g.opened && g.opened > lm).length : 0;
  const draft = S.draft.filter(d => d.s===s);
  h += `<div class="viewbar"><div class="seg" role="group" aria-label="Strategy views"><button aria-pressed="${S.dview==='summary'}" data-act="dview" data-v="summary">Summary</button><button aria-pressed="${S.dview==='sheet'}" data-act="dview" data-v="sheet">Strategy sheet</button></div></div>`;
  if (S.dview==='summary') return h + renderSummary(s);
  if (S.edit) h += `<div class="draftbar"><b>Draft</b><span>${draft.length} change${draft.length===1?'':'s'}</span><input id="draftNote" placeholder="Note for this snapshot (why)" value="${esc(S.draftNote)}"><button class="btn primary small" data-act="saveSnap" ${draft.length?'':'disabled'}>Save snapshot</button><button class="btn small" data-act="discard">Discard</button></div>`;
  h += `<article class="sheet"><div class="sheet-hd"><div><h1 class="pg">${esc(st.name)}</h1>

    return `<div class="pos"><span class="stance">${esc(p.stance)}</span><span><b>${esc(p.subj)}</b></span><span class="counts" style="font-weight:600;color:var(--ink-3)">relies on ${p.relies.length} assumptions ${c?`<span class="c-contra">▲${c}</span>`:''}${w?`<span class="c-weak">▼${w}</span>`:''}</span></div>`;
  }).join('') + `</section>`;
  h += `<section class="sec"><h2>Why: bets and assumptions</h2>`;
  const bets = [...new Set(st.asms.map(x => LIB[x.key].bet))];
  bets.forEach(b => {
    h += `<div class="bet"><div class="role">${ROLES[b]}</div><div class="txt">“${esc(BETS[b])}”</div></div>`;
    st.asms.filter(x => LIB[x.key].bet===b).forEach(x => {
      const ev = evalAsm(s, x.key, S.asOf); const a = ev.a;
      const ch = draft.find(d => d.key===x.key);
      const convCell = S.edit
        ? `<select data-act="conv" data-s="${s}" data-k="${x.key}" aria-label="Conviction">${['low','medium','high'].map(c => `<option ${a.conv===c?'selected':''}>${c}</option>`).join('')}</select>`
        : `${ch ? `<span class="old">${ch.from}</span>` : ''}${a.conv}`;
      h += `<div class="arow ${ch?'changed':''}" role="button" tabindex="0" data-act="panel" data-s="${s}" data-k="${x.key}">
        <span class="nec">${a.nec ? '<b>● necessary</b>' : '○ supporting'}</span>
        <span>${esc(a.text)}${a.type==='prediction' ? ` <span class="meta" style="color:var(--ink-3);font-size:13px">prediction, resolves ${fds(a.resolves)}</span>` : ''}</span>
        <span class="conv hide-sm">${convCell}</span>
        <span>${stateChip(ev.state)}</span>
        <span class="hide-sm">${vizFor(s, x.key, S.asOf, true)}</span></div>`;
    });
    AISUG.filter(g => g.s===s && g.newAsm && g.bet===b && g.d<=S.asOf && !S.sugStatus[g.id]).forEach(g => {
      h += `<div class="arow ai-sug"><span class="nec">${pvAI(g.d)}</span><span>${esc(g.text)}</span><span class="hide-sm"></span><span class="btns"><button class="btn small ai" data-act="sug" data-v="${g.id}" data-do="adopt">Adopt</button><button class="btn small" data-act="sug" data-v="${g.id}" data-do="dismiss">Dismiss</button></span><span class="hide-sm"></span></div>`;
    });
  });
  h += `</section>`;
  // Risk map
  const holders = [...new Set(st.risk.map(r => r.holder))];
  const types = [...new Set(st.risk.map(r => r.type))];
  h += `<section class="sec"><h2>Risk map · your levels, 1–5; blank means no view</h2><div class="scroll-x"><table class="rm num"><tr><th></th>${types.map(t => `<th>${t}</th>`).join('')}</tr>` +
    holders.map(ho => `<tr><td class="h">${esc(ho)}</td>${types.map(t => { const r = st.risk.find(x => x.holder===ho && x.type===t); if (!r) return '<td></td>';

      return `<td class="lvl${lv}" title="${r.driven ? 'Driven by: ' + r.driven.map(k => asmDef(s,k).text).join('; ') : ''}${up ? ` (was ${r.prev} until ${fds(r.changed)})` : ''}">${lv}${up ? ' <span class="up" aria-label="raised">↑</span>' : ''}</td>`; }).join('')}</tr>`).join('') + `</table></div></section>`;
  if (st.protections.length || st.triggers.length) {
    h += `<section class="sec"><h2>Protections and break triggers</h2><div class="plist">` +
      st.protections.map(p => `<div class="prow"><b>Protection:</b> ${esc(p.text)} · protects ${esc(p.holder)} · ends ${fd(p.expires)} ${days(S.asOf,p.expires)<=90 ? stateChip('expiring') : ''}<span style="color:var(--ink-3)">${esc(p.note)}</span></div>`).join('') +
      st.triggers.map(t => { const os = obsFor(t.ind, S.asOf); const l = os[os.length-1]; return `<div class="prow"><b>Break trigger:</b> ${esc(t.text)} · now ${l ? fv(t.ind, l.v) : '—'} ${l && l.v >= t.trip*0.9 ? stateChip(l.v>=t.trip?'fired':'near') : ''} <span style="color:var(--ink-3)">leads to: ${esc(t.leads)}</span></div>`; }).join('') + `</div></section>`;
  }
  // History
  const tl = hist.map(x => ({ ...x, type:'snap' })).concat(cl.meetings.filter(m => m <= S.asOf).map(m => ({ d:m, type:'meeting' })));
  tl.sort((a,b) => b.d.localeCompare(a.d));
  h += `<section class="sec"><h2>History</h2><div class="tl">` + tl.map(x => x.type==='meeting'
    ? `<div class="it meeting"><div class="d">${fd(x.d)} · client meeting</div><div style="color:var(--ink-2);font-size:14px">Presented the snapshot of ${fds([...hist].reverse().find(y => y.d <= x.d)?.d || x.d)}.</div></div>`
    : `<div class="it"><div class="d">${fd(x.d)} · snapshot <span style="font-weight:400;color:var(--ink-3)">(${esc(x.trigger)})</span></div><div>${esc(x.note)}</div><ul>${x.changes.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>`).join('') + `</div></section>`;
  h += `</article>`;
  return h;

function renderSummary(s) {
  const st = STRATS[s], cl = CLIENTS[st.client];
  const lm = lastMeeting(st.client, S.asOf), nm = nextMeeting(st.client, S.asOf);
  const posLine = p => { const sts = p.relies.map(k => evalAsm(s, k, S.asOf).state); const c = sts.filter(x => x==='contradicting').length, w = sts.filter(x => x==='weakening').length;
    return c ? stateChip('contradicting', c>1 ? ` (${c})` : '') : w ? stateChip('weakening', w>1 ? ` (${w})` : '') : stateChip('supported'); };
  const counting = st.asms.filter(x => x.nec).map(x => ({ x, a: asmDef(s, x.key), e: evalAsm(s, x.key, S.asOf) }));
  const moved = lm ? collectGaps([s], S.asOf).filter(g => g.state!=='ai' && g.opened && g.opened > lm) : [];
  const movedText = g => g.kind==='asm' ? asmDef(s, g.key).plain : g.kind==='trigger' ? `Break trigger close: ${g.t.text}.` : `${g.p.text} ends ${fd(g.p.expires)}.`;
  return `<article class="sheet summary-page">
    <div class="sum-eyebrow">Client summary · ${esc(cl.name)} · as of ${fd(S.asOf)}</div>

      <section><h2>What we hold</h2><ul class="sum-list">${st.positions.map(p => `<li><span><b>${esc(p.stance)}</b> · ${esc(p.subj)}</span>${posLine(p)}</li>`).join('')}</ul></section>
      <section><h2>What we are counting on</h2><ul class="sum-list">${counting.map(({ x, a, e }) => `<li role="button" tabindex="0" class="sum-click" data-act="panel" data-s="${s}" data-k="${x.key}"><span>${esc(a.plain)}</span>${stateChip(e.state)}</li>`).join('')}</ul></section>

      <section><h2>What we will watch${nm ? ` before ${fds(nm)}` : ''}</h2><ul class="sum-list">${st.watch.map(i => `<li><span>${esc(IND[i].name)}</span></li>`).join('')}</ul></section>
    </div>
    <div class="btns" style="margin-top:18px"><button class="btn primary" data-act="present">Record as presented${nm ? ` on ${fds(nm)}` : ''}</button><button class="btn" data-act="dview" data-v="sheet">See the full strategy sheet →</button></div>
  </article>`;
}

      <h2>${esc(a.text)}</h2><p class="plain">${esc(a.plain)}</p>
      <div class="facts"><span>${a.type==='prediction' ? `Prediction, resolves ${fd(a.resolves)}` : 'Assumption'}</span><span>${a.conv} conviction</span><span>${a.nec?'necessary':'supporting'} for “${esc(BETS[a.bet])}”</span>${a.ind ? `<span>Expectation: ${esc(IND[a.ind].name)} ${a.rule==='atLeast'?'≥ '+fv(a.ind,a.th):a.rule==='atMost'?'≤ '+fv(a.ind,a.th):a.rule==='up'?'keeps rising':'keeps falling'}${a.tol!=null?`, tolerance ${fv(a.ind,a.tol)}`:''}</span>` : '<span>Qualitative: judged by you</span>'}</div>

    </div><button class="x" data-act="close" aria-label="Close">×</button></div>
    <div class="db">

function update({ strip = true } = {}) {
  clipN = 0;
  renderHeader(); renderTabs(); if (strip) renderStrip(); renderSide(); renderMain(); renderPanel(); renderModal();
}
function toast(msg) {
  const t = document.getElementById('toast'); t.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.innerHTML = '', 3200);
}

/* ============================ REPLAY ============================ */
const ICON_PLAY = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5 L10.5 6 L3 10.5 Z" fill="currentColor"/></svg>';
const ICON_PAUSE = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="1.5" width="2.5" height="9" fill="currentColor"/><rect x="7" y="1.5" width="2.5" height="9" fill="currentColor"/></svg>';
const REPLAY_MS = 9000;
let anim = null;
function setPlayButton() {
  const b = document.getElementById('playBtn'); if (!b) return;
  b.innerHTML = anim ? ICON_PAUSE : ICON_PLAY;
  b.setAttribute('aria-pressed', String(!!anim));
  b.setAttribute('aria-label', anim ? 'Pause replay' : 'Play replay from the start');
}
function setAsOfDay(d) {
  S.asOf = addDays(START, d);
  const r = document.getElementById('asof'); if (r) r.value = d;
  const l = document.getElementById('asofLbl'); if (l) l.textContent = fd(S.asOf);
  update({ strip:false });
}
function playReplay() {
  const total = days(START, END); const t0 = performance.now(); let last = -1;
  anim = { raf: 0 };
  setPlayButton();
  const step = now => {
    if (!anim) return;
    const k = Math.min(1, (now - t0) / REPLAY_MS); const d = Math.round(k * total);
    if (d !== last) { last = d; setAsOfDay(d); }
    if (k < 1) anim.raf = requestAnimationFrame(step); else stopReplay();
  };
  anim.raf = requestAnimationFrame(step);
}
function stopReplay() { if (anim) cancelAnimationFrame(anim.raf); anim = null; setPlayButton(); }

/* ============================ EVENTS ============================ */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName==='SELECT') return;
  const act = b.dataset.act, v = b.dataset.v;
  switch (act) {
    case 'tab': S.tab = v; S.library = false; if (S.strat==='template') S.strat='all'; break;
    case 'view': S.view = v; break;
    case 'strat': S.strat = v; S.library = false; S.dview = 'summary'; S.edit = false; break;
    case 'template': S.strat = 'template'; S.library = false; break;
    case 'library': S.library = !S.library; S.panel = null; break;
    case 'about': S.modal = 'about'; break;
    case 'dview': S.dview = v; if (v==='summary') S.edit = false; break;
    case 'closeModal': S.modal = null; break;
    case 'present': { const st = STRATS[S.strat]; const nm = nextMeeting(st.client, S.asOf); toast(nm ? `Recorded: this snapshot will be presented to ${CLIENTS[st.client].short} on ${fds(nm)}.` : 'No upcoming meeting.'); break; }
    case 'filter': S.filters[v] = !S.filters[v]; break;
    case 'panel': S.panel = { s:b.dataset.s, key:b.dataset.k }; break;
    case 'close': S.panel = null; break;
    case 'edit': S.edit = !S.edit; break;
    case 'openDecision': S.tab = 'decision'; S.dview = 'sheet'; S.strat = b.dataset.s; S.panel = null; S.library = false; break;
    case 'review': S.reviews.push({ s:b.dataset.s, key:b.dataset.k, d:S.asOf, outcome:'No change', note:'Reviewed in Watch.' }); toast('Recorded your review. The gap moves to Reviewed until new evidence arrives.'); break;
    case 'lower': { const s = b.dataset.s, k = b.dataset.k, a = asmDef(s, k); const to = a.conv==='high' ? 'medium' : 'low'; setConv(s, k, a.conv, to); S.reviews.push({ s, key:k, d:S.asOf, outcome:'Changed the strategy', note:`Conviction ${a.conv} → ${to} (in draft).` }); toast(`Added to draft: conviction ${a.conv} → ${to}. Save a snapshot in Decision.`); break; }
    case 'judge': { const s = b.dataset.s, k = b.dataset.k; S.judged.push({ s, key:k, obs:b.dataset.o, stance:v, d:S.asOf, origin:'analyst', note: b.dataset.ai ? 'Agreed with the AI stance.' : '', basedOn: b.dataset.ai ? 'ai' : null }); toast(b.dataset.ai ? 'Recorded as your judgment, based on the AI stance. The AI record stays as it was.' : 'Recorded your judgment.'); break; }
    case 'sug': { const g = AISUG.find(x => x.id===v); S.sugStatus[v] = b.dataset.do;
      if (b.dataset.do==='adopt' && g.action?.type==='conv') { const a = asmDef(g.s, g.key); setConv(g.s, g.key, a.conv, g.action.to); toast('Adopted: a new analyst change in the draft, based on the AI suggestion.'); }
      else if (b.dataset.do==='adopt' && g.newAsm) { S.draft.push({ s:g.s, key:'new-'+g.id, from:'', to:'added', label:'Added assumption (based on AI suggestion): ' + g.text }); S.edit = true; toast('Added to draft as your assumption, based on the AI suggestion.'); }
      else if (b.dataset.do==='adopt') toast('Adopted as your note, based on the AI suggestion.');
      else toast('Dismissed. The AI suggestion stays in history as dismissed.');
      break; }
    case 'saveSnap': { const s = S.strat; const ch = S.draft.filter(d => d.s===s);
      (S.extraHistory[s] = S.extraHistory[s] || []).push({ d:S.asOf, note: S.draftNote || 'Saved from draft.', trigger:'gap', changes: ch.map(d => d.label || `${asmDef(s,d.key).text}: conviction ${d.from} → ${d.to}`), keys: ch.map(d => d.key) });
      S.draft = S.draft.filter(d => d.s!==s); S.draftNote=''; S.edit = false; toast('Snapshot saved.'); break; }
    case 'discard': { const s = S.strat; S.draft.filter(d => d.s===s && d.from).forEach(d => delete S.conv[s+':'+d.key]); S.draft = S.draft.filter(d => d.s!==s); S.edit = false; break; }
    case 'toast': toast(v); return;
    case 'play': if (anim) stopReplay(); else playReplay(); return;
    default: return;
  }
  update({ strip: act==='strat' || act==='tab' || act==='library' });
});
document.addEventListener('keydown', e => {
  if (e.key==='Escape') { if (S.modal) S.modal = null; else if (S.panel) S.panel = null; else return; update({ strip:false }); }
  if ((e.key==='Enter' || e.key===' ') && e.target.matches('.arow[role=button], .gap[role=button], .sum-click')) { e.preventDefault(); e.target.click(); }
});
function setConv(s, k, from, to) {
  const ex = S.draft.find(d => d.s===s && d.key===k);
  if (ex) { ex.to = to; if (ex.from===to) { S.draft = S.draft.filter(d => d!==ex); } } else S.draft.push({ s, key:k, from, to });
  S.conv[s+':'+k] = to;
}
document.addEventListener('change', e => {
  if (e.target.id==='clientSel') { S.client = e.target.value; S.strat = 'all'; S.panel = null; update(); }
  if (e.target.id==='stratSel') { S.strat = e.target.value; S.dview = 'summary'; S.edit = false; update(); }
  if (e.target.dataset.act==='conv') { const s = e.target.dataset.s, k = e.target.dataset.k; setConv(s, k, asmDef(s,k).conv, e.target.value); update({ strip:false }); }
});
document.addEventListener('input', e => {
  if (e.target.id==='asof') { stopReplay(); S.asOf = addDays(START, +e.target.value); document.getElementById('asofLbl').textContent = fd(S.asOf); update({ strip:false }); }
  if (e.target.id==='draftNote') S.draftNote = e.target.value;
});
// Close the modal only when the backdrop itself is clicked.
document.getElementById('modal').addEventListener('click', e => { if (e.target.classList.contains('modal')) { S.modal = null; update({ strip:false }); } }, true);

update();
</script>

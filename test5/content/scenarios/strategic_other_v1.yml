# The fallback template, used when no commitment type is recognized or the
# visitor picks "Other strategic commitment".
#
# Commitment, rationale, evidence shift, capital-still-in-play figure,
# flexibility window and authority transcribed from docs/SCENARIO_CONTENT.md
# §"strategic_other_v1", which asks for a "neutral strategic-initiative
# template suitable for fallback behavior". Conditions, comparables and the
# capital components are authored to that brief and deliberately kept generic:
# this template must read sensibly for a commitment of any kind.
# All figures are illustrative.

id: strategic_other_v1
type: strategic_other
title: Strategic Operating Initiative
amountLabel: "$15M"
activeCommitmentText: Fund a $15M strategic operating initiative

# One or two sentences of plain business context, shown under the picker
# on S1. Illustrative, like everything else in this file.
description: >-
  Stand up a shared operating capability across the business units. Returns expected from consolidated processes, lower unit costs, and faster delivery to internal customers.
authority: Executive Sponsor and Capital Committee

# The individual accountable for the refresh, shown on the receipt. Distinct
# from `authority` above, which is the body the commitment goes back to.
owner: Executive sponsor

# How the receipt names the commitment. docs/README.md §S1 shows the card as
# "Fund a $12M regional expansion program" but §S3's receipt row as
# "$12M regional expansion program" — the leading verb phrase is dropped.
# check-content.ts asserts this is a suffix of activeCommitmentText.
receiptCommitmentText: $15M strategic operating initiative

rationale:
  - The initiative was expected to improve a defined operating outcome.
  - Required resources were expected to remain available.
  - The implementation plan was expected to remain feasible within the authorized window.

conditions:
  - id: outcome
    label: The initiative supports the defined operating outcome
    watchedEvidence: Operating outcome trend
    reconsiderationCondition: The measured outcome remains below the authorized range for two reporting cycles
    why: "The initiative was expected to improve a defined operating outcome."
    status: new_evidence
  - id: resources
    label: Required resources remain available to the current scope
    watchedEvidence: Resource and staffing plan
    reconsiderationCondition: Committed resources fall below the level assumed at authorization
    why: "Required resources were expected to remain available."
    status: within_range
  - id: feasibility
    label: The implementation plan remains feasible within the authorized window
    watchedEvidence: Implementation milestone plan
    reconsiderationCondition: Critical milestones move more than 45 days
    why: "The implementation plan was expected to remain feasible within the authorized window."
    status: within_range

evidenceShiftConditionId: outcome
evidenceShiftStatement: A condition supporting the current scope has moved outside the range used at authorization.
evidenceShiftInterpretation: >-
  The commitment is not automatically invalid. One condition that shaped its
  original scope has moved. The relevant question is whether the current scope
  remains the best use of the capital still in play.

# AUTHORED, NOT SPEC. docs/SCENARIO_CONTENT.md gives only "$8.5M still in
# play" against a $15M initiative. Split as scope not yet started (5.5) plus
# in-flight work still resizeable (3.0); 6.5 is already spent or committed.
# See docs/PLAN.md R4.
plannedUncommittedCapital: 5500000
practicallyChangeableCapital: 3000000
irreversiblyCommittedCapital: 6500000
expectedCapitalStillInPlayLabel: "$8.5M"

flexibilityWindowDays: 45
lockInDescription: the next material operating lock-in
flexibilityWindowText: 45 days before the next material operating lock-in

comparableCommitments:
  - year: "2023"
    title: Operating program
    relevantCondition: Outcome measure
    evidenceShift: The measured outcome held below the authorized range
    whatHappenedNext: Scope was revisited while most of the plan was still open
    changedBeforeScheduledReview: true
    reviewedAfterLockIn: false
  - year: "2024"
    title: Service initiative
    relevantCondition: Resource availability
    evidenceShift: Committed resources fell below the assumed level
    whatHappenedNext: Delivery was staged and remaining capital was redirected
    changedBeforeScheduledReview: false
    reviewedAfterLockIn: false
  - year: "2025"
    title: Operating model change
    relevantCondition: Implementation timing
    evidenceShift: Critical milestones moved beyond the authorized window
    whatHappenedNext: Review occurred after operating commitments were in place
    changedBeforeScheduledReview: true
    reviewedAfterLockIn: true

# About-us team carousel. Each item: name, bio.
# Rendered by _includes/carousel.html.

- name: Steve Strassmann, CEO
  bio: >-
    Steve is a 3x founder with a PhD in AI from MIT. He has held senior
    engineering roles at Apple, Benchling, Kyruus, VMware, Orange, and others.
    He served as CTO of Massachusetts, and has been EIR and a visiting scholar
    at Harvard Medical School and the Wyss Institute.

- name: Michael Schrage, Founding Partner
  bio: >-
    Michael is a Lecturer at the MIT Sloan School of Management and Visiting
    Fellow in the Imperial College Department of Innovation and
    Entrepreneurship. One of the world's foremost authorities on managing
    innovation, advising Mars, P&G, Google, Intel, and IBM, and publishing
    regularly in Harvard Business Review, the Financial Times, and the Wall
    Street Journal.

- name: Stan Kugell, Director
  bio: >-
    Stan was a researcher at the MIT AI Lab, Stanford AI Lab, and Xerox PARC,
    and the founder of three software companies. He's a board director of a
    dozen corporations and nonprofits in US and Europe. He holds and has held
    investor, director & C-suite roles in pharma, biotech, telecom, IT, and
    artificial intelligence.

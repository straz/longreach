# Home-page pitch carousel. Each item: eyebrow, problem, solution.
# Rendered by _includes/carousel.html.

- eyebrow: Assumptions
  problem: Which of your commitments still spend money on assumptions that are no longer true?
  solution: >-
    Know when changed evidence deserves your reconsideration.

- eyebrow: Commitments
  problem: Which decisions would you *not* make again today? How do you know?
  solution: >-
    Find the resources still governed by yesterday’s mistaken judgment.

- eyebrow: Learning
  problem: What did your last ten decisions teach your next ten? Are *you* getting smarter?
  solution: >-
    Make every consequential commitment evidence for the next one.

- eyebrow: Instrumentation
  problem: You measure performance and KPIs. But do you measure when management should change its mind? Why not?
  solution: >-
    Instrument reconsideration – not just performance.

- eyebrow: Authority
  problem: When the evidence changes, who can change the decision?
  solution: >-
    Expose where yesterday’s authority still governs today’s resources.

- eyebrow: Memory
  problem: Can you reconstruct why you believed what you believed when you committed the money?
  solution: >-
    Preserve what you assumed, considered, rejected and authorized. Selective amnesia is dangerous.

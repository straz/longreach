# public, RLS-protected key (the same one already shipped in the cards/ bundle).
# A row inserted into the `leads` table fires the existing Supabase -> Modal
# webhook that sends the emails.
supabase:
  url: "https://astvrwkwhpckcyqqdotu.supabase.co"
  anon_key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzdHZyd2t3aHBja2N5cXFkb3R1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg3ODI5OTcsImV4cCI6MjA4NDM1ODk5N30.gTO0wbeP5Pvwl1jMpVLR9SHbrRFavI-bUMiH-vx0GJo"

# Card and prose content lives in content/ as YAML + Markdown.
# YAML files there load as site.data.<name> (e.g. site.data.pitch_cards);
# `exclude` keeps the raw files out of the built _site.
data_dir: content

exclude:
  - content
  # Vite apps: built by .github/workflows/deploy.yml and copied into _site
  # after the Jekyll build. Jekyll must not process their source trees
  # (otherwise it publishes each app's dev index.html at /<app>/).
  - cards
  - test2
  - test3
  - test4
  - "*.md"

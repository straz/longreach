<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} &middot; Longreach{% else %}Longreach{% endif %}</title>
  <link rel="icon" href="{{ site.baseurl }}/logo.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ site.baseurl }}/home.css">
</head>
<body>

  <nav class="navbar">
    <div class="container-fluid px-4">
      <a class="navbar-brand brand-identity" href="{{ site.baseurl }}/">
        <img src="{{ site.baseurl }}/longreach-logo.svg" alt="Longreach logo" class="brand-logo">
        <span class="brand-name ms-2">LONG<span class="brand-bold">REACH</span></span>
      </a>
      <ul class="nav-links">
        <li><a href="{{ site.baseurl }}/"{% if page.url == "/" %} class="active"{% endif %}>Home</a></li>
        <li><a href="{{ site.baseurl }}/#what-we-do">What we do</a></li>
        <li><a href="{{ site.baseurl }}/about-us/"{% if page.url contains "about-us" %} class="active"{% endif %}>About us</a></li>
        <li><a href="{{ site.baseurl }}/try-us/"{% if page.url contains "try-us" %} class="active"{% endif %}>Try us</a></li>
        <li><a href="https://www.longreach.ai/cards/">AI Pathologies</a></li>
      </ul>
    </div>
  </nav>

  <main class="page">
    <div class="page-inner">
      {{ content }}
    </div>
  </main>

  <script src="{{ site.baseurl }}/carousel.js" defer></script>

</body>
</html>
